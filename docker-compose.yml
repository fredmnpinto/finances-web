version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: finances
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d finances"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - llm

  web:
    image: nixserver:5000/finances-web:latest
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: dummy_key_for_testing_do_not_use_in_production
      DATABASE_URL: postgres://admin:adminpass@db:5432/finances
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      NODE_ENV: production
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
      SENTRY_DSN: "${SENTRY_DSN}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
