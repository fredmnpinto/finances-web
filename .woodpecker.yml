steps:
  - name: build
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      TZ: "UTC"
      DOCKER_HOST: tcp://docker:2375
    commands:
      - nix build .#docker-image
      - docker load < result
    when:
      - event: push

  - name: test
    image: finances-web:latest
    environment:
      TZ: "UTC"
      RAILS_ENV: test
      DATABASE_URL: postgres://admin:adminpass@postgres:5432/finances_web_test
    commands:
      - bundle exec rake assets:precompile
      - bundle exec rake db:create db:migrate
      - bundle exec rspec
    depends_on:
      - build
    when:
      - event: push

  - name: push
    image: docker:24-cli
    environment:
      TZ: "UTC"
      DOCKER_HOST: tcp://docker:2375
    commands:
      - docker tag finances-web:latest nixserver:5000/finances-web:latest
      - docker push nixserver:5000/finances-web:latest
    depends_on:
      - build
      - test
    when:
      - event: push
        branch: main

services:
  - name: docker
    image: docker:24-dind
    privileged: true

  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: finances_web_test
