pipeline:
  test:
    image: nixos/nix:latest
    commands:
      - nix develop -c bundle exec rspec
    when:
      - event: [push, pull_request]

  build:
    image: nixos/nix:latest
    commands:
      - nix build .#docker-image
      - docker load < result
      - docker tag finances-web:latest nixserver:5000/finances-web:latest
      - docker push nixserver:5000/finances-web:latest
    when:
      - event: push
        branch: main
