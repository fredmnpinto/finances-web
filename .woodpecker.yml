steps:
  - name: test
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      TZ: "UTC"
      RAILS_ENV: test
      DATABASE_URL: postgres://admin:adminpass@postgres:5432/finances_web_test
    commands:
      - nix develop -c bundle exec rake assets:precompile RAILS_ENV=test
      - nix develop -c bundle exec rake db:create db:migrate RAILS_ENV=test
      - nix develop -c bundle exec rspec
    when:
      - event: push

  - name: build-and-push
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      TZ: "UTC"
    commands:
      - nix build .#docker-image --rebuild
      - docker load < result
      - docker tag finances-web:latest nixserver:5000/finances-web:latest
      - docker push nixserver:5000/finances-web:latest
    when:
      - event: push
        branch: main

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: finances_web_test